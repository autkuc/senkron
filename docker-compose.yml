services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: senkron-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - BACKEND_URL=http://backend:4000
      - MODAL_LLM_ENDPOINT=${MODAL_LLM_ENDPOINT:-}
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: senkron-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MODAL_LLM_ENDPOINT=${MODAL_LLM_ENDPOINT:-}
